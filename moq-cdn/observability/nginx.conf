server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/config {
        proxy_pass http://router:8080/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/channels {
        proxy_pass http://router:8080/channels;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Local-only routing experiment. The physical Caddy configuration does
    # not expose this endpoint to the Internet.
    location = /api/route {
        proxy_pass http://router:8080/route;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
