server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /relay-fingerprint {
        proxy_pass https://relay:4443/fingerprint;
        proxy_ssl_verify off;
    }

    location = /metrics {
        proxy_pass http://relay:9090/metrics;
    }

    location = /origin-metrics {
        proxy_pass http://origin-relay:9090/metrics;
    }

    location = /c1-metrics {
        proxy_pass http://edge-c1:9090/metrics;
    }

    location = /route {
        proxy_pass http://router:8080/route;
    }

    location = /compare {
        proxy_pass http://router:8080/compare;
    }

    location = /router-metrics {
        proxy_pass http://router:8080/metrics;
    }
}
