name: ncdn-moq

x-moq: &moq
  image: ncdn-moq-observable:933a443
  build:
    context: https://github.com/cloudflare/moq-rs.git#933a443d98b65bc536f0b6753e51a17b5eeaba15
    dockerfile_inline: |
      FROM rust:bookworm AS builder
      WORKDIR /build
      COPY . ./
      RUN --mount=type=cache,target=/usr/local/cargo/registry \
          --mount=type=cache,target=/build/target \
          cargo build --release \
            -p moq-relay-ietf --features metrics-prometheus \
            -p moq-clock-ietf && \
          cp /build/target/release/moq-relay-ietf /usr/local/cargo/bin/ && \
          cp /build/target/release/moq-clock-ietf /usr/local/cargo/bin/
      FROM debian:bookworm-slim
      RUN apt-get update && \
          apt-get install -y --no-install-recommends ca-certificates libssl3 && \
          rm -rf /var/lib/apt/lists/*
      COPY --from=builder /usr/local/cargo/bin/moq-relay-ietf /usr/local/bin/
      COPY --from=builder /usr/local/cargo/bin/moq-clock-ietf /usr/local/bin/
  environment:
    RUST_LOG: info,quinn=warn

services:
  relay:
    <<: *moq
    entrypoint: moq-relay-ietf
    command:
      - --bind
      - "[::]:4443"
      - --tls-cert
      - /certs/localhost.crt
      - --tls-key
      - /certs/localhost.key
      - --dev
      - --metrics-addr
      - "0.0.0.0:9090"
      - --qlog-dir
      - /artifacts/qlog
      - --qlog-serve
      - --mlog-dir
      - /artifacts/mlog
      - --mlog-serve
    ports:
      - "4443:4443/udp"
      - "4443:4443/tcp"
      - "9091:9090/tcp"
    volumes:
      - ./certs:/certs:ro
      - ./artifacts:/artifacts

  publisher:
    <<: *moq
    entrypoint: moq-clock-ietf
    command:
      - https://relay:4443
      - --tls-disable-verify
      - --publish
    depends_on:
      - relay
    restart: on-failure

  subscriber:
    <<: *moq
    entrypoint: moq-clock-ietf
    command:
      - https://relay:4443
      - --tls-disable-verify
    depends_on:
      - relay
      - publisher
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - relay

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
