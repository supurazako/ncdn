name: ncdn-moq

x-moq: &moq
  image: ncdn-moq-observable:69302d3
  build:
    context: https://github.com/cloudflare/moq-rs.git#69302d3dc2422e93b8a1d62f853a6759aa9e5468
    dockerfile_inline: |
      FROM rust:bookworm AS builder
      WORKDIR /build
      COPY . ./
      RUN --mount=type=cache,target=/usr/local/cargo/registry \
          --mount=type=cache,target=/build/target \
          cargo build --release \
            -p moq-relay-ietf --features metrics-prometheus \
            -p moq-clock-ietf \
            -p moq-pub && \
          cp /build/target/release/moq-relay-ietf /usr/local/cargo/bin/ && \
          cp /build/target/release/moq-clock-ietf /usr/local/cargo/bin/ && \
          cp /build/target/release/moq-pub /usr/local/cargo/bin/
      FROM debian:bookworm-slim
      RUN apt-get update && \
          apt-get install -y --no-install-recommends ca-certificates ffmpeg libssl3 && \
          rm -rf /var/lib/apt/lists/*
      COPY --from=builder /usr/local/cargo/bin/moq-relay-ietf /usr/local/bin/
      COPY --from=builder /usr/local/cargo/bin/moq-clock-ietf /usr/local/bin/
      COPY --from=builder /usr/local/cargo/bin/moq-pub /usr/local/bin/
  environment:
    RUST_LOG: info,quinn=warn

services:
  origin-relay:
    <<: *moq
    entrypoint: moq-relay-ietf
    command:
      - --bind
      - "[::]:4443"
      - --node
      - https://origin-relay:4443
      - --tls-cert
      - /certs/localhost.crt
      - --tls-key
      - /certs/localhost.key
      - --coordinator-file
      - /coordinator/moq.json
      - --metrics-addr
      - "0.0.0.0:9090"
      - --qlog-dir
      - /artifacts/origin/qlog
      - --mlog-dir
      - /artifacts/origin/mlog
    ports:
      - "9092:9090/tcp"
    volumes:
      - ./certs:/certs:ro
      - ./artifacts:/artifacts
      - coordinator-data:/coordinator

  relay:
    <<: *moq
    entrypoint: moq-relay-ietf
    command:
      - --bind
      - "[::]:4443"
      - --node
      - https://relay:4443
      - --tls-cert
      - /certs/localhost.crt
      - --tls-key
      - /certs/localhost.key
      - --dev
      - --tls-disable-verify
      - --coordinator-file
      - /coordinator/moq.json
      - --metrics-addr
      - "0.0.0.0:9090"
      - --qlog-dir
      - /artifacts/qlog
      - --qlog-serve
      - --mlog-dir
      - /artifacts/mlog
      - --mlog-serve
    ports:
      - "4443:4443/udp"
      - "4443:4443/tcp"
      - "9091:9090/tcp"
    volumes:
      - ./certs:/certs:ro
      - ./artifacts:/artifacts
      - coordinator-data:/coordinator

  edge-c1:
    <<: *moq
    entrypoint: moq-relay-ietf
    command:
      - --bind
      - "[::]:4443"
      - --node
      - https://edge-c1:4443
      - --tls-cert
      - /certs/localhost.crt
      - --tls-key
      - /certs/localhost.key
      - --dev
      - --tls-disable-verify
      - --coordinator-file
      - /coordinator/moq.json
      - --metrics-addr
      - "0.0.0.0:9090"
      - --qlog-dir
      - /artifacts/c1/qlog
      - --mlog-dir
      - /artifacts/c1/mlog
    ports:
      - "4444:4443/udp"
      - "4444:4443/tcp"
      - "9093:9090/tcp"
    volumes:
      - ./certs:/certs:ro
      - ./artifacts:/artifacts
      - coordinator-data:/coordinator

  publisher:
    <<: *moq
    entrypoint: moq-clock-ietf
    command:
      - https://origin-relay:4443
      - --tls-disable-verify
      - --publish
    depends_on:
      - origin-relay
    restart: on-failure

  video-publisher:
    <<: *moq
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ffmpeg -hide_banner -loglevel warning -re \
          -f lavfi -i "testsrc2=size=960x540:rate=30" \
          -an -c:v libx264 -preset ultrafast -tune zerolatency \
          -g 60 -keyint_min 60 -sc_threshold 0 \
          -f mp4 -movflags empty_moov+frag_every_frame+separate_moof+omit_tfhd_offset - \
        | moq-pub --name demo --fps 30 --bitrate 1500000 \
            --tls-disable-verify https://origin-relay:4443
    depends_on:
      - origin-relay
    restart: on-failure

  subscriber:
    <<: *moq
    entrypoint: moq-clock-ietf
    command:
      - https://relay:4443
      - --tls-disable-verify
    depends_on:
      - relay
      - publisher
    restart: on-failure

  subscriber-c1:
    <<: *moq
    entrypoint: moq-clock-ietf
    command:
      - https://edge-c1:4443
      - --tls-disable-verify
    depends_on:
      - edge-c1
      - publisher
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - relay

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  visualizer:
    image: nginx:1.29-alpine
    ports:
      - "3002:80"
    volumes:
      - ./visualizer:/usr/share/nginx/html:ro
      - ./observability/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - relay
      - edge-c1
      - video-publisher

volumes:
  prometheus-data:
  grafana-data:
  coordinator-data:
