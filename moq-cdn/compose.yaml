name: ncdn-moq

services:
  relay:
    image: moqdev/moq-relay:0.14.9
    command: /config/relay.toml
    ports:
      - "4443:4443/udp"
      - "4443:4443/tcp"
    volumes:
      - ./moqdev/relay.toml:/config/relay.toml:ro

  publisher:
    image: moqdev/moq-cli:0.9.9
    command:
      - --client-connect
      - http://relay:4443
      - --broadcast
      - demo.hang
      - import
      - srt
      - --listen
      - "[::]:9000"
    depends_on:
      - relay
    restart: on-failure

  video-source:
    image: jrottenberg/ffmpeg:7.1-alpine
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=960x540:rate=30
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "60"
      - -keyint_min
      - "60"
      - -sc_threshold
      - "0"
      - -f
      - mpegts
      - srt://publisher:9000?mode=caller&streamid=demo
    depends_on:
      - publisher
    restart: on-failure

  visualizer:
    image: nginx:1.29-alpine
    ports:
      - "3002:80"
    volumes:
      - ./visualizer:/usr/share/nginx/html:ro
      - ./observability/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - relay
